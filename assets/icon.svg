<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D42A00"/>
      <stop offset="100%" stop-color="#B32D00"/>
    </linearGradient>
  </defs>

  <!-- Nền gradient xanh biển. Hai hex này PHẢI khớp Color.hot /
       Color.hotDark trong src/constants/theme.ts — đổi palette thì đổi ở đây
       rồi chạy lại `node scripts/generate-icons.js`, không sửa tay file PNG. -->
  <rect width="512" height="512" rx="115" fill="url(#brand)"/>

  <!-- Glyph: tờ báo trắng + huy hiệu sparkle (AI tóm tắt) -->
  <g>
    <!-- Tờ báo -->
    <rect x="96" y="112" width="276" height="288" rx="30" fill="#FFFFFF"/>
    <!-- Khối ảnh headline -->
    <rect x="130" y="148" width="208" height="72" rx="12" fill="url(#brand)"/>
    <!-- Dòng tin -->
    <rect x="130" y="244" width="208" height="24" rx="12" fill="url(#brand)"/>
    <rect x="130" y="286" width="208" height="24" rx="12" fill="url(#brand)"/>
    <rect x="130" y="328" width="132" height="24" rx="12" fill="url(#brand)"/>
    <!-- Huy hiệu sparkle -->
    <circle cx="364" cy="364" r="72" fill="url(#brand)" stroke="#FFFFFF" stroke-width="10"/>
    <path transform="translate(364 364)" fill="#FFFFFF"
      d="M0 -40 C 7 -13, 13 -7, 40 0 C 13 7, 7 13, 0 40 C -7 13, -13 7, -40 0 C -13 -7, -7 -13, 0 -40 Z"/>
  </g>
</svg>
