<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="newsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#aiGradient)" filter="url(#glow)"/>

  <!-- Newspaper shape -->
  <g transform="translate(80, 70)">
    <!-- Newspaper body -->
    <rect x="0" y="0" width="352" height="372" rx="16" fill="white" filter="url(#glow)"/>

    <!-- Fold line -->
    <line x1="0" y1="100" x2="352" y2="100" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Header area -->
    <rect x="24" y="120" width="180" height="28" rx="4" fill="url(#newsGradient)"/>

    <!-- AI brain icon in header -->
    <g transform="translate(216, 134)">
      <ellipse cx="0" cy="0" rx="18" ry="14" fill="none" stroke="url(#aiGradient)" stroke-width="2.5"/>
      <path d="M-12,0 Q0,-10 12,0 Q0,10 -12,0" fill="none" stroke="url(#aiGradient)" stroke-width="2"/>
      <path d="M-8,-4 Q0,0 8,-4" stroke="url(#aiGradient)" stroke-width="1.5" fill="none"/>
      <path d="M-8,4 Q0,0 8,4" stroke="url(#aiGradient)" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Article lines -->
    <g fill="#64748b">
      <rect x="24" y="176" width="304" height="16" rx="4"/>
      <rect x="24" y="208" width="280" height="16" rx="4"/>
      <rect x="24" y="240" width="304" height="16" rx="4"/>
      <rect x="24" y="272" width="260" height="16" rx="4"/>
    </g>

    <!-- Summary lines (shorter, highlighted) -->
    <g fill="url(#aiGradient)">
      <rect x="24" y="312" width="200" height="14" rx="4"/>
      <rect x="24" y="336" width="180" height="14" rx="4"/>
    </g>

    <!-- Sparkle/AI indicator -->
    <g transform="translate(310, 340)" fill="url(#aiGradient)">
      <polygon points="0,-8 2,-2 8,-2 3,2 5,8 0,5 -5,8 -3,2 -8,-2 -2,-2" />
      <circle cx="0" cy="0" r="3" fill="white"/>
    </g>
  </g>

  <!-- Floating particles for AI effect -->
  <g fill="url(#aiGradient)" opacity="0.6">
    <circle cx="120" cy="120" r="4">
      <animate attributeName="cy" values="120;100;120" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="140" r="3">
      <animate attributeName="cy" values="140;120;140" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="420" r="3">
      <animate attributeName="cy" values="420;400;420" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="380" r="4">
      <animate attributeName="cy" values="380;360;380" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- App name initial -->
  <text x="256" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="white" opacity="0.9">N</text>
</svg>